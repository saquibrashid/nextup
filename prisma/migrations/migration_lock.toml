# Please do not edit this file manually
# It should be added in your version-control system (i.e. Git)
#
# ⚠ `mssql`, NOT `sqlserver`. `prisma/schema.prisma` declares the datasource
# provider as `sqlserver`, and Prisma normalises that to `mssql` internally
# before comparing it against this file. Writing the schema's spelling here
# passes `prisma validate` and every local check, then fails `migrate deploy`
# in CI with P3019 — "the datasource provider `mssql` ... does not match the
# one specified in the migration_lock.toml, `sqlserver`" — which reads like a
# corrupted migration history and is not one.
#
# This file was MISSING entirely until TASK-047. `migrate deploy` tolerates
# its absence, but `migrate diff --from-migrations` cannot determine the
# connector without it, so drift detection silently did nothing.
provider = "mssql"