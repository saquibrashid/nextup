<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER — NOT THE TMDB LOGO. Replace before release.

  The real mark must be taken from TMDB's own brand assets
  (https://www.themoviedb.org/about/logos-attribution) and dropped in here
  under the same filename, which `specs/api.md` §6.1 fixes as
  `/assets/tmdb-logo.svg`.

  It is not committed by an agent on purpose: the TMDB logo is a trademark and
  redrawing an approximation of it is exactly the kind of "close enough" that
  the attribution obligation (NFR-013, specs/security.md) exists to prevent.

  This file deliberately reads "placeholder" on screen. A silently plausible
  stand-in would let `T-ATTR-003` (the logo renders with a non-zero box) pass
  while the licensing obligation is still unmet — and specs/ui.md §8 is built
  entirely around the fact that this failure is invisible from inside the app.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 40" width="190" height="40" role="img" aria-label="TMDB">
  <rect x="0.5" y="0.5" width="189" height="39" rx="6" fill="#0d253f" stroke="#90cea1" />
  <text x="12" y="26" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#01b4e4">TMDB</text>
  <text x="76" y="25" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#90cea1">logo placeholder</text>
</svg>
