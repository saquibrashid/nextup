name: Composition preview
on:
  push:
    branches: [feat/compact-artwork-cards]
permissions:
  contents: read
concurrency:
  group: composition-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run typecheck && npm run lint && npm run format:check
      - name: Component checks
        if: ${{ !cancelled() }}
        run: npx vitest run --project web listSurface listSearch filterBar stylesheet --maxWorkers=2
      - name: Browser composition
        if: ${{ !cancelled() }}
        run: npx playwright test refinedLibrary.spec.ts guidedCapture.spec.ts --grep "T-MOCK|T-POL-004|T-POL-003c|T-UX-155c|T-UX-141e|T-UX-156i" --workers=2 --retries=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: composition-preview
          path: |
            test-results/
            playwright-report/
            apps/web/dist/
          retention-days: 3
