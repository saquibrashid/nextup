# CI — the only gate (RSK-025).
#
# The TWELVE blocking jobs specified in specs/testing.md §8. **Every job
# blocks. There are no advisory jobs and nothing may carry
# `continue-on-error`** — an advisory job in a one-reviewer project is a job
# nobody reads. Branch protection requires all twelve green plus a linear
# history.
#
# This workflow does NOT publish or deploy anything; deployment is TASK-007's
# deploy.yml.
#
# ⚠ Several suites are still empty and run with a "pass with no tests" flag.
# Each flag must be removed by the task that lands that suite's FIRST test —
# see CHANGELOG. A suite that passes green while asserting nothing is the
# single easiest way for this gate to become decorative.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1 ─────────────────────────────────────────────────────────────────────
  lint:
    name: '1 · lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      # A separate step so a formatting failure names its cause instead of
      # hiding inside eslint output.
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck

  # ── 2 ─────────────────────────────────────────────────────────────────────
  secrets:
    name: '2 · secrets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history as well as the working tree; a shallow
          # clone would silently scan almost nothing.
          fetch-depth: 0
      # Run the pinned gitleaks image directly rather than gitleaks-action.
      # The action calls the GitHub API (`pulls/:n/commits`) on pull_request
      # events, which needs `pull-requests: read`; this workflow grants only
      # `contents: read`, so the action crashed on EVERY pull request while
      # passing on every push to main — the job was red for a reason that had
      # nothing to do with secrets, and the real findings underneath it were
      # never reported. Scanning the checkout directly needs no token, so push
      # and pull_request now scan identically, and a Dependabot PR (whose token
      # is read-only regardless of what the workflow declares) behaves the same
      # as any other. `--exit-code 1` is explicit: the whole point is to fail.
      - name: gitleaks
        env:
          # renovate/dependabot do not track digests in `run:` steps, so this
          # pin is updated by hand alongside any gitleaks version bump.
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" --entrypoint sh "$GITLEAKS_IMAGE" \
            -c 'git config --global --add safe.directory /repo && exec gitleaks detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose --exit-code 1'
      # ⚠ STEPS, never new jobs. Branch protection requires exactly the twelve
      # job contexts named in `specs/testing.md` §8; adding a thirteenth job
      # makes the ruleset unsatisfiable and blocks every merge.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # TASK-030 / `T-SEC-001`, `T-SEC-011` — no streaming credentials, no
      # password handling, no auth or browser-automation dependency. gitleaks
      # finds secrets that look like secrets; this finds the DESIGN that would
      # need one (NFR-008: nextup never holds a streaming credential).
      - name: No credentials or automation dependencies
        run: npm run check:credentials
      # TASK-122 / `T-SEC-031` — the outbound host allow-list. The product
      # makes no automated request to any streaming service, ever; this is the
      # gate that keeps that true as code is added.
      - name: Outbound host allow-list
        run: npm run check:outbound

  # ── 3 ─────────────────────────────────────────────────────────────────────
  audit:
    name: '3 · audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # High and critical only (§8 job 3). Moderate and low findings in
      # dev-only tooling do not ship in the image and must not block a
      # one-person project on a breaking major upgrade.
      #
      # BLOCKING on what ships. `--omit=dev` scopes this to the runtime tree,
      # which is what reaches the container and the owner.
      #
      # ⚠ Scoped on 2026-08-13 for GHSA-2v37-7h3g-55p8 (`nanoid <3.3.18`,
      # high), reachable only via `postcss → vite → vitest`. The patched
      # 3.3.18 is NOT published on the Microsoft-directed registry this
      # project must install from — 3.3.17 is the newest available and is
      # what is installed — so the finding was unfixable, not unfixed, and
      # an unfixable blocking gate trains everyone to ignore a red build.
      # The production tree reported zero vulnerabilities throughout.
      # REVISIT when the registry mirrors 3.3.18: restore the unscoped
      # command and delete the reporting step below.
      #
      # ⚠ Scoped again on 2026-08-17 for GHSA-ggr8-5vv4-36mx (`deepmerge-ts`,
      # high), reachable only as `@prisma/client → prisma → @prisma/config`,
      # i.e. the Prisma CLI config loader. No patched version exists, and
      # npm's suggested fix is a DOWNGRADE of prisma 6.19.3 → 6.12.0 reported
      # in the same field as an upgrade. Rather than weaken --audit-level or
      # block indefinitely on an unfixable finding, the gate now runs through
      # tools/check-audit.mjs, which allow-lists individual advisories with a
      # written justification AND fails on an allow-list entry that is no
      # longer reported — so the exception deletes itself once upstream ships
      # a fix, instead of quietly becoming policy.
      - name: npm audit (production dependencies — blocking, T-SEC-034)
        run: npm run check:audit
      # NON-BLOCKING, and deliberately not deleted: a dev-tooling compromise
      # is a real supply-chain path (it runs on every developer machine and
      # in CI with repository credentials), so the findings must stay visible
      # rather than silently disappear with the scoping above.
      - name: npm audit (full tree — report only)
        continue-on-error: true
        run: npm audit --audit-level=high
      # NFR-005 is absolute: no telemetry, no analytics, no APM. This is a
      # CI allow-list check, not a review convention — a reviewer skims a
      # lockfile diff, this does not. Also enforces T-CI-006 (actions pinned
      # to commit SHAs, because a tag is mutable).
      - name: Dependency allow-list (T-SEC-009, T-CI-006)
        run: npm run check:deps

      # T-LICENSE-001. The behavioural assertions live in tests/infra, but the
      # CLI runs here too: when THIRD-PARTY-NOTICES.md drifts, this prints the
      # one-line remedy ("run npm run notices") instead of a byte-comparison
      # diff. A notice obligation that is only satisfiable by reading a failed
      # assertion is one that gets switched off.
      - name: Third-party licence notices (T-LICENSE-001)
        run: npm run check:licences

      # T-STATUS-001. Runs here rather than as a 13th job so the branch
      # ruleset's twelve required status contexts stay valid. The CLI prints
      # which claim failed and why ("TASK-nnn is marked done but its Done when
      # test is not in the suite"), which is the actionable form.
      - name: Task status ledger (T-STATUS-001)
        run: npm run check:status

      # T-META-005. Upstream of check:status: that gate asks whether a done
      # task's tests are implemented, this one asks whether the ids the backlog
      # cites are REAL. When it was added, 89 of 276 cited ids (32%) were
      # defined nowhere in specs/testing.md, and three tasks had already been
      # implemented against ids invented at the keyboard. A row whose "Done
      # when" names a test that does not exist has no definition of done, and
      # nothing else in CI can tell.
      - name: Backlog test ids are defined (T-META-005)
        run: npm run check:test-ids

      # T-META-003. The mirror of check:test-ids, looking the other way. That
      # gate asks whether the ids the BACKLOG cites are real; this one asks
      # whether specs/testing.md's own mapping holds up: every criterion it
      # claims is verifiable must resolve to an id the file defines, and every
      # criterion with no test must be declared in §10 with a compensating
      # check beside it. Deleting an id from a Test cell is a one-character
      # diff that drops a criterion from the definition of done, and before
      # this gate nothing in CI could see it — T-META-001 counts the row as
      # mapped, T-META-005 sees no id to resolve, and T-STATUS-001 only
      # inspects tasks already claimed done.
      - name: Verifiable decisions resolve to defined tests (T-META-003)
        run: npm run check:decisions

      # T-CI-008. Guards the worst failure class in this repo: a spec file in a
      # path no runner collects never executes, so its assertions "pass" and CI
      # goes green while nothing was checked. This is not theoretical — the
      # backlog and the parallel-execution plan both pointed paste tests at
      # tests/web/, and a canary asserting 1 === 2 there was reported as part
      # of a fully passing suite. Runs after check:status because it shells out
      # to `vitest list` and is the slower of the two.
      - name: Test locations are collected (T-CI-008)
        run: npm run check:test-locations

  # ── 4 ─────────────────────────────────────────────────────────────────────
  test-unit:
    name: '4 · test:unit + coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Coverage thresholds from specs/testing.md §1 are enforced by
      # vitest.config.ts and fail this job on their own.
      - name: Unit tests with coverage
        run: npm run coverage

  # ── 5 ─────────────────────────────────────────────────────────────────────
  test-int:
    name: '5 · test:int'
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Str0ng!Passw0rd_ci' # CI-only, non-secret, ephemeral
          MSSQL_PID: 'Developer' # free edition for CI
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠ AZURITE IS NOT A SERVICE CONTAINER, AND MUST NOT BE TURNED BACK INTO
      # ONE. A `services:` entry cannot pass command ARGUMENTS — it accepts
      # only `image`, `env`, `ports`, `volumes` and docker-create `options` —
      # and Azurite needs `--skipApiVersionCheck`. Without it every blob write
      # fails with:
      #
      #   RestError: The API version 2026-06-06 is not supported by Azurite.
      #
      # …because `@azure/storage-blob` sends a service version newer than the
      # emulator knows. That surfaces as `INTERNAL_ERROR` on the upload route,
      # so it reads as an application bug rather than an emulator one, and it
      # is INVISIBLE locally because `docker-compose.test.yml` has always
      # passed the flag. The two must stay in step: this is the CI half of
      # that file's promise to mirror it.
      #
      # Started as a step for exactly that reason. `--blobHost 0.0.0.0` is
      # required too, or the container binds loopback and the port mapping
      # connects to nothing.
      - name: Start Azurite (blob emulator)
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:latest \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 1 30); do
            # No `-f`: an unauthenticated request to Azurite answers 400/403,
            # which is proof the service is LISTENING. `-f` would treat that
            # as failure and the loop would never succeed.
            if curl -s -o /dev/null "http://127.0.0.1:10000/devstoreaccount1"; then
              echo "Azurite is up"; exit 0
            fi
            sleep 2
          done
          echo "Azurite did not become ready"; docker logs azurite; exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # An explicit wait backstops the service health check before migrations —
      # the mssql container is not ready the instant the port opens (§3.3a).
      #
      # sqlcmd is run INSIDE the service container via `docker exec`, because
      # /opt/mssql-tools18/bin/sqlcmd exists only in the mssql image. Microsoft
      # client tools are NOT installed on ubuntu-24.04 runners (removed in the
      # 24.04 image), so invoking that path directly on the runner fails with
      # "No such file or directory". See specs/testing.md §3.3a.
      - name: Wait for SQL Server
        env:
          MSSQL_SA_PASSWORD: 'Str0ng!Passw0rd_ci'
        run: |
          cid=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format '{{.ID}}' | head -n1)
          if [ -z "$cid" ]; then
            echo "mssql service container not found" && exit 1
          fi
          for i in $(seq 1 30); do
            if docker exec "$cid" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; then
              echo "SQL Server is ready" && exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready" && exit 1

      # Migrations are applied BEFORE the suite runs, never by the suite (§3.3a).
      #
      # ⚠ The COLLATE clause below is NOT optional. Prisma's create() joins a
      # `DECLARE @generated_keys table([id] NVARCHAR(200))` variable back to the
      # inserted row. A table variable takes the DATABASE DEFAULT collation, so
      # on a CI_AS database that join compares CI_AS against the BIN2 [id]
      # column and EVERY insert fails with Msg 468. Measured: 24 of 25
      # integration tests failed on the default collation, all passed on BIN2.
      # See specs/data-model.md §16.2.1 and infra/sqldb.bicep. T-INV-018
      # asserts the live collation so a dropped clause fails loudly.
      #
      # -I sets QUOTED_IDENTIFIER ON, which the three FILTERED unique indexes
      # require; without it they are never created and T-INV-001/002/015 pass
      # while asserting nothing (specs/testing.md §3.3a).
      - name: Create the test database
        env:
          MSSQL_SA_PASSWORD: 'Str0ng!Passw0rd_ci'
        run: |
          cid=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format '{{.ID}}' | head -n1)
          docker exec "$cid" /opt/mssql-tools18/bin/sqlcmd -C -I -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -b \
            -Q "IF DB_ID('nextup_test') IS NULL CREATE DATABASE [nextup_test] COLLATE Latin1_General_100_BIN2;"

      - name: Apply migrations
        env:
          DATABASE_URL: 'sqlserver://localhost:1433;database=nextup_test;user=sa;password=Str0ng!Passw0rd_ci;encrypt=true;trustServerCertificate=true'
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      # A migration that has drifted from schema.prisma is a landmine: the next
      # `prisma migrate dev` would emit DROP INDEX / DROP CONSTRAINT to
      # reconcile them, which T-MIG-001 forbids outright. Assert they agree.
      - name: Check schema and migration agree
        env:
          DATABASE_URL: 'sqlserver://localhost:1433;database=nextup_test;user=sa;password=Str0ng!Passw0rd_ci;encrypt=true;trustServerCertificate=true'
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Integration tests
        env:
          DATABASE_URL: 'sqlserver://localhost:1433;database=nextup_test;user=sa;password=Str0ng!Passw0rd_ci;encrypt=true;trustServerCertificate=true'
          AZURE_STORAGE_CONNECTION_STRING: 'UseDevelopmentStorage=true'
        run: npm run test:int

  # ── 6 ─────────────────────────────────────────────────────────────────────
  test-web:
    name: '6 · test:web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Component tests
        run: npm run test:web

  # ── 7 ─────────────────────────────────────────────────────────────────────
  golden:
    name: '7 · golden'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # OFFLINE, replayed recordings only. `goldenLive.spec.ts` is excluded by
      # vitest.config.ts and must never run here: it calls the live extraction
      # providers and costs money (§4A). No provider keys are exposed to this
      # job, so a mistake fails loudly rather than billing quietly.
      - name: Extractor golden suite
        run: npm run golden

  # ── 8 ─────────────────────────────────────────────────────────────────────
  test-e2e:
    name: '8 · test:e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build
        run: npm run build
      - name: E2E (Chromium + Mobile Safari)
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

  # ── 9 ─────────────────────────────────────────────────────────────────────
  test-a11y:
    name: '9 · test:a11y'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # axe on all nine routes; ZERO serious/critical (§8 job 9). The
      # zero-tolerance threshold lives in the spec file itself, not here.
      - name: Accessibility scan
        run: npm run test:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7

  # ── 10 ────────────────────────────────────────────────────────────────────
  infra:
    name: '10 · infra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `bicep build` is a compile, not a deployment — it needs no Azure
      # credentials and no subscription. `what-if` DOES need both, so it
      # belongs to the deploy workflow, not to a gate that must run on every
      # pull request.
      - name: Bicep build
        run: |
          shopt -s nullglob
          files=(infra/*.bicep)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .bicep files yet (TASK-006)"
            exit 0
          fi
          az bicep install
          for f in "${files[@]}"; do
            echo "bicep build $f"
            # --stdout, NOT the default outfile. `az bicep build --file
            # infra/main.bicep` would WRITE infra/main.json, overwriting the
            # committed artifact with a fresh compile — after which the drift
            # check below would compare a fresh compile against itself and
            # pass vacuously, no matter what the Bicep said.
            az bicep build --file "$f" --stdout > /dev/null
          done
      # The committed infra/main.json is what the T-INFRA-* tests assert
      # against. This proves it still matches infra/main.bicep, so the tests
      # can never pass against a stale template.
      - name: Compiled ARM is not stale
        run: npm run check:infra
      # T-INFRA-*, T-INV-013 and T-MIG-001 (the destructive-migration gate).
      - name: Infra and invariant tests
        run: npm run test:infra
      # TASK-121 / `T-MUT-001`, `T-MUT-002` — every mutating route resolves to
      # one of the owner-initiated actions REQ-041 enumerates. Product
      # invariant 5: no scheduler may change user-visible list state, so a
      # mutating route with no owner action behind it is the shape that
      # invariant fails in.
      - name: Mutating-route registry
        run: npm run check:mutating-routes

      # TASK-035 / `T-INV-006` — dateAdded is write-once. The corruption this
      # guards is silent and permanent: an update that rewrites dateAdded
      # destroys the only record of when a title entered the list, and nothing
      # downstream can tell the difference between a corrupted date and a real
      # one. The infra suite above already executes the assertions; this step
      # exists so the failure names the offending file and line directly.
      - name: dateAdded is write-once
        run: npm run check:write-once

      # The mirror of `check:test-ids`. That gate walks backlog → spec ("is the
      # id the work order cites real?"); this one walks spec → backlog ("does
      # every id the spec defines have someone who will build it?"). The second
      # failure is the quieter one — an unowned criterion never blocks a task,
      # so the ledger reaches 100% with the behaviour missing. It found
      # TASK-037's genre filter doing nothing and US-018 AC-4 unimplemented.
      - name: Every defined test id is owned
        run: npm run check:orphans

  # ── 11 ────────────────────────────────────────────────────────────────────
  meta:
    name: '11 · meta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # T-META-001: every acceptance criterion maps to a named test that
      # actually exists. This is the job that catches the spec growing past
      # its suite.
      - name: AC to test mapping completeness
        run: npm run test:meta

  # ── 12 ────────────────────────────────────────────────────────────────────
  build:
    name: '12 · build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build workspaces
        run: npm run build
      # The production container image. Built but NOT pushed: publishing is
      # the deploy workflow's job and must not happen from a pull request.
      # No `if [ -f Dockerfile ]` guard — a missing Dockerfile must fail this
      # job, not skip it silently.
      - name: Build container image
        run: docker build -t nextup:ci .
      # The exit criterion for TASK-005, asserted rather than assumed: ONE
      # container on ONE port serves both the SPA shell and the API. If the
      # static handler ever shadows the API mount (or vice versa) this fails.
      - name: Container serves the SPA and the API on one port
        run: |
          set -euo pipefail
          docker run -d --name nextup-ci -p 3000:3000 nextup:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then break; fi
            if [ "$i" = "30" ]; then docker logs nextup-ci; exit 1; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/ | grep -q '<div id="root"'
          # /api/me fails closed until the principal adapter lands (TASK-018).
          # 401 with the error envelope proves the route is mounted and that
          # it is NOT being served the SPA shell.
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' http://localhost:3000/api/me)
          test "$code" = "401"
          grep -q 'UNAUTHENTICATED' /tmp/me.json
          # The image must not ship the build toolchain.
          docker run --rm --entrypoint sh nextup:ci -c '
            for p in vite typescript vitest eslint prettier; do
              if [ -e "node_modules/$p" ]; then echo "dev dependency in runtime image: $p"; exit 1; fi
            done'
          docker rm -f nextup-ci
      # T-SEC-019 (no dev shim in dist) is asserted by TASK-004's static
      # checks once the image exists.
