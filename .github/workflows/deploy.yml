name: deploy

# Staging first, always. A commit to main reaches production only by passing
# through a real staging deployment and a real smoke suite against it.
#
# Registry is ghcr.io, authenticated with the built-in GITHUB_TOKEN. There is
# NO PAT on this path and none is needed: the package is public and Container
# Apps pulls it anonymously. See docs/ghcr-pat.md — a fine-grained PAT cannot
# authenticate to ghcr.io at all, which is why that document exists.
#
# Azure auth is an OIDC federated credential. No Azure secret is stored.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deployments race the same environment. `cancel-in-progress`
  # is deliberately false: cancelling midway through a migration or a traffic
  # shift leaves the environment in a state nobody chose.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RESOURCE_GROUP: nextup-rg
  # ⚠ REGIONS ARE NOT SET HERE. They live in infra/main.{prod,staging}.bicepparam,
  # which is what the deploy steps read. Two env vars named LOCATION and
  # SQL_LOCATION used to sit here and were passed inline; they are gone rather
  # than left unused, because a stale-but-authoritative-looking value in this
  # file is precisely the failure this workflow already had once.
  #
  # The regions are eastus2 for everything except Azure SQL, which is
  # centralus: Azure SQL refused new logical servers in eastus2 for this
  # subscription (`ProvisioningDisabled`) while every other resource deploys
  # there fine. See infra/main.bicep `sqlLocation` and
  # docs/runbooks/deployment-identity.md before collapsing these into one.

jobs:
  # ── 1 ───────────────────────────────────────────────────────────────────────
  build:
    name: '1 · build & push image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠ BLOCKS BOTH ENVIRONMENTS. A destructive migration must never reach a
      # deployment, so the same gate CI runs is re-run here against the exact
      # commit being deployed — CI green on an older commit is not evidence.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Destructive-migration gate (T-MIG-001)
        run: npx vitest run tests/infra/migrations.spec.ts

      - id: meta
        run: echo "image=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build to a local image FIRST and scan it. Pushing and then scanning
      # publishes the secret and merely tells you about it afterwards; ghcr
      # retains the layer even if the tag is deleted.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the BUILT IMAGE, not the source tree. CI already scans the repo;
      # this catches a secret introduced by the build itself — a baked .env, a
      # copied credential, a token in a layer that never existed in git.
      - name: Secret-scan the built image (before push)
        run: |
          set -euo pipefail
          mkdir -p /tmp/img && docker save "${{ steps.meta.outputs.image }}" -o /tmp/img/image.tar
          tar -xf /tmp/img/image.tar -C /tmp/img
          docker run --rm -v /tmp/img:/scan \
            "$GITLEAKS_IMAGE" detect --no-git --source=/scan --redact --exit-code 1
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "${{ steps.meta.outputs.image }}"

  # ── 2 ───────────────────────────────────────────────────────────────────────
  staging:
    name: '2 · deploy staging'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      fqdn: ${{ steps.deploy.outputs.fqdn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: deploy
        name: az deployment group create (staging)
        # ⚠ USES infra/main.staging.bicepparam. This workflow previously passed
        # every parameter inline and never opened the .bicepparam files at all,
        # while infra/README.md and docs/architecture.md both documented them
        # as the per-environment source of truth. The result was a silent trap:
        # `deployAi = true` was set in the staging parameter file, `what-if`
        # against that file showed the AI resources being created, CI reported
        # a green deploy — and nothing was provisioned, because CI was reading
        # a different set of parameters. Never reintroduce inline parameters
        # here; the file that is reviewed must be the file that deploys.
        #
        # Dynamic values reach the file through readEnvironmentVariable(), so
        # they are set as env: below rather than as --parameters.
        env:
          NEXTUP_IMAGE: ${{ needs.build.outputs.image }}
          NEXTUP_SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          NEXTUP_SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          NEXTUP_ENTRA_ADMIN_OBJECT_ID: ${{ secrets.ENTRA_ADMIN_OBJECT_ID }}
          NEXTUP_ENTRA_ADMIN_LOGIN: ${{ secrets.ENTRA_ADMIN_LOGIN }}
          NEXTUP_ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          NEXTUP_ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          # A48. ⚠ TMDB_API_KEY IS NOW REQUIRED: a missing repository secret
          # resolves to '', the .bicepparam has no default for it, and the
          # deployment FAILS. That is deliberate — Container Apps rejects an
          # empty secret, so the alternative was never "deploy unconfigured",
          # it was "deploy something that looks fine and cannot reach TMDB".
          NEXTUP_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Epic M (REQ-092). Required for the same reason and by the same
          # mechanism: no default, empty secret rejected, deploy fails loudly.
          NEXTUP_OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          # Optional. Empty denies everyone; the allow-list fails closed.
          NEXTUP_ALLOWED_SUBJECTS: ${{ secrets.ALLOWED_SUBJECTS }}
        run: |
          set -euo pipefail
          # ⚠ NO --template-file. A .bicepparam declares its own template with
          # `using`, and az rejects the combination.
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --parameters infra/main.staging.bicepparam \
            --query properties.outputs -o json > outputs.json
          echo "fqdn=$(node -p "require('./outputs.json').appFqdn.value")" >> "$GITHUB_OUTPUT"
          echo "sql=$(node -p "require('./outputs.json').sqlServerFqdn.value")" >> "$GITHUB_OUTPUT"
          echo "db=$(node -p "require('./outputs.json').databaseName.value")" >> "$GITHUB_OUTPUT"

      # ⚠ `migrate deploy` ONLY. `prisma migrate dev` rewrites migration
      # history and `prisma db push` drops whatever does not match the schema
      # — either one against a real database is unrecoverable data loss, and
      # neither may ever appear in a workflow (TASK-007, REQ-028).
      - name: prisma migrate deploy (staging)
        env:
          DATABASE_URL: sqlserver://${{ steps.deploy.outputs.sql }}:1433;database=${{ steps.deploy.outputs.db }};user=${{ secrets.SQL_ADMIN_LOGIN }};password=${{ secrets.SQL_ADMIN_PASSWORD }};encrypt=true;trustServerCertificate=false
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Staging smoke suite (T-SMOKE-*)
        env:
          SMOKE_BASE_URL: https://${{ steps.deploy.outputs.fqdn }}
        run: npm run test:smoke

  # ── 3 ───────────────────────────────────────────────────────────────────────
  production:
    name: '3 · deploy production'
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Read the revision the owner is currently being served BEFORE anything
      # changes, and pin traffic to it for the duration of the deployment. This
      # must happen before `az deployment group create`, not after: ARM applies
      # the traffic block as part of the deployment, so a hold applied
      # afterwards is a hold on a revision that is already live.
      #
      # ⚠ Two DIFFERENT empty results, which must not be conflated:
      #   * the command fails      → the app does not exist. True bootstrap.
      #   * revisionName is null   → a `latestRevision: true` weight, which is
      #                              what the bicep bootstrap branch and Single
      #                              revision mode both produce. The app IS
      #                              serving something; the entry just doesn't
      #                              name it. Treating this as "first
      #                              deployment" silently skips the hold on a
      #                              live app — observed on the first prod run.
      # So a null name is resolved to the newest revision rather than dropped.
      - id: prev
        name: Read the revision currently serving traffic
        run: |
          set -euo pipefail
          APP="ca-nextup-prod"
          if TRAFFIC=$(az containerapp ingress traffic show -n "$APP" -g "$RESOURCE_GROUP" -o json 2>/dev/null); then
            CUR=$(echo "$TRAFFIC" | node -e 'const t=JSON.parse(require("fs").readFileSync(0,"utf8"));const e=(t||[]).find(x=>x.weight>0);process.stdout.write(e&&e.revisionName?e.revisionName:"")')
            if [ -z "$CUR" ]; then
              CUR=$(az containerapp revision list -n "$APP" -g "$RESOURCE_GROUP" \
                      --query "sort_by([].{n:name,t:properties.createdTime},&t)[-1].n" -o tsv)
              echo "Traffic entry named no revision; resolved the live one to: $CUR"
            fi
          else
            CUR=""
          fi
          echo "revision=${CUR}" >> "$GITHUB_OUTPUT"
          echo "Holding traffic on: ${CUR:-<none — the app does not exist yet>}"

      - id: deploy
        name: az deployment group create (prod, new revision at 0% traffic)
        # ⚠ USES infra/main.prod.bicepparam — see the equivalent staging step
        # for why inline parameters must never come back.
        env:
          NEXTUP_IMAGE: ${{ needs.build.outputs.image }}
          NEXTUP_HOLD_REVISION: ${{ steps.prev.outputs.revision }}
          NEXTUP_SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          NEXTUP_SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          NEXTUP_ENTRA_ADMIN_OBJECT_ID: ${{ secrets.ENTRA_ADMIN_OBJECT_ID }}
          NEXTUP_ENTRA_ADMIN_LOGIN: ${{ secrets.ENTRA_ADMIN_LOGIN }}
          NEXTUP_ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          NEXTUP_ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          # A48 — see the staging job above.
          NEXTUP_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXTUP_OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          NEXTUP_ALLOWED_SUBJECTS: ${{ secrets.ALLOWED_SUBJECTS }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --parameters infra/main.prod.bicepparam \
            --query properties.outputs -o json > outputs.json
          echo "fqdn=$(node -p "require('./outputs.json').appFqdn.value")" >> "$GITHUB_OUTPUT"
          echo "app=$(node -p "require('./outputs.json').containerAppName.value")" >> "$GITHUB_OUTPUT"
          echo "sql=$(node -p "require('./outputs.json').sqlServerFqdn.value")" >> "$GITHUB_OUTPUT"
          echo "db=$(node -p "require('./outputs.json').databaseName.value")" >> "$GITHUB_OUTPUT"

      - name: prisma migrate deploy (prod)
        env:
          DATABASE_URL: sqlserver://${{ steps.deploy.outputs.sql }}:1433;database=${{ steps.deploy.outputs.db }};user=${{ secrets.SQL_ADMIN_LOGIN }};password=${{ secrets.SQL_ADMIN_PASSWORD }};encrypt=true;trustServerCertificate=false
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      # ⚠ The smoke suite MUST target the new revision's own FQDN, not the app
      # FQDN. The app FQDN is precisely what is still pinned to the OLD
      # revision, so smoking it would test the code that is already known to
      # work and report green for a new revision nobody ever contacted. That
      # is not a hypothetical: it is what the first production run did.
      # On a first deployment there is no hold, the latest revision owns the
      # app FQDN, and the two URLs are equivalent.
      - id: target
        name: Resolve the new revision and its private FQDN
        run: |
          set -euo pipefail
          APP="${{ steps.deploy.outputs.app }}"
          NEW=$(az containerapp revision list -n "$APP" -g "$RESOURCE_GROUP" \
                  --query "sort_by([].{n:name,t:properties.createdTime},&t)[-1].n" -o tsv)
          FQDN=$(az containerapp revision show -n "$APP" -g "$RESOURCE_GROUP" \
                  --revision "$NEW" --query properties.fqdn -o tsv)
          if [ -z "$FQDN" ]; then
            echo "::error::Revision $NEW has no FQDN; refusing to smoke a URL that may be the old revision."
            exit 1
          fi
          echo "revision=$NEW" >> "$GITHUB_OUTPUT"
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Production smoke suite (T-SMOKE-*)
        env:
          SMOKE_BASE_URL: https://${{ steps.target.outputs.fqdn }}
        run: npm run test:smoke

      # Only now. A failure in any step above leaves production serving the
      # previous revision, so no rollback is needed in that case.
      #
      # If a bad deploy DOES reach production, rollback is TWO commands in a
      # fixed order — `revision activate` and only then this traffic command.
      # Verified on live Azure 2026-08-18: pointing traffic at a deactivated
      # revision exits 0, prints the new weight table, and then serves 404.
      # Since the step below deactivates the superseded revision, the rollback
      # target is always inactive, so the one-command form is always wrong.
      # Full procedure: docs/runbooks/rollback.md.
      - name: Shift traffic to 100%
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            -n "${{ steps.deploy.outputs.app }}" -g "$RESOURCE_GROUP" \
            --revision-weight "${{ steps.target.outputs.revision }}=100"

      # Prod runs minReplicas = 1, so a superseded revision left Active bills a
      # replica for ever — the blue/green gate above would otherwise double the
      # standing cost of the app on every single deploy. Deactivating does NOT
      # delete it: it stays listed and reactivatable, which is what makes
      # rollback a revision switch rather than a rebuild.
      # `if: always()` is deliberately NOT used — if the shift did not happen,
      # the old revision is still serving the owner and must stay up.
      - name: Deactivate the superseded revision
        if: steps.prev.outputs.revision != ''
        run: |
          set -euo pipefail
          az containerapp revision deactivate \
            -n "${{ steps.deploy.outputs.app }}" -g "$RESOURCE_GROUP" \
            --revision "${{ steps.prev.outputs.revision }}"
