version: 2
updates:
  # npm — the monorepo root picks up all workspaces.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Packages that must move TOGETHER or CI cannot even install.
    #
    # Ungrouped, Dependabot raised `@typescript-eslint/eslint-plugin` 7 -> 8 on
    # its own and left `@typescript-eslint/parser` at 7. They are peers, so
    # `npm ci` died with ERESOLVE and all twelve jobs failed on a PR that could
    # never have passed in any order. The same trap applies to vite/plugin-react
    # and to the vitest packages, which share a version line.
    groups:
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
      testing-library:
        patterns:
          - '@testing-library/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # `prisma` (CLI) and `@prisma/client` are generated-code peers: the client
      # is emitted BY the CLI, so a version skew fails at `prisma generate`, not
      # at install. Ungrouped, Dependabot raised them as #27 and #30 — two PRs
      # that could not pass in any order or combination, 8 red jobs each.
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
    # Majors that CANNOT be taken yet. Each names the condition that unblocks
    # it, because an `ignore` with no exit criterion silently becomes permanent.
    ignore:
      # RELEASED - the runtime moved to Node 22 and the first production deploy
      # on it succeeded, which was the exit criterion recorded here.
      # `@testing-library/jest-dom` majors need Node >= 22 and nothing else, so
      # it carries no ignore now; Dependabot raises it against
      # registry.npmjs.org, which is also the only correct way to regenerate
      # `package-lock.json` here (docs/runbooks/update-dependencies.md 6 and 7).
      # `jsdom` was released by the same step but has since been re-held for an
      # UNRELATED reason - see its own entry below.
      # ~~Superseded (jsdom re-held 2026-10-08, accessible-name regression):
      # "`jsdom` and `@testing-library/jest-dom` majors need Node >= 22 and
      # nothing else, so they carry no ignore now".~~
      #
      # `@types/node` is NOT released outright, and must not be. It is the type
      # view of the runtime, so it is capped at the major actually running
      # rather than floated to latest: typechecking against APIs that are absent
      # at run time moves the failure out of CI and into production. Capping by
      # version (not by update-type) lets the 20 -> 22 bump through while still
      # refusing 23+. `T-INFRA-018d` fails CI if this cap is ever circumvented.
      # UNBLOCKED BY: the runtime moving to Node 23+ - raise this bound with it.
      - dependency-name: '@types/node'
        versions: ['>=23']
      # typescript-eslint refuses to load against the TS 7.0 compiler API
      # ("typescript-eslint does not support TS 7.0"), so taking TS 7 would
      # disable linting across the repo rather than fail loudly. The project
      # sits on TS 6, which typescript-eslint v8 does support.
      # UNBLOCKED BY: typescript-eslint TS >= 7.1 support, tracked upstream at
      # typescript-eslint/typescript-eslint#10940.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0 <7.1.0']
      # jsdom >= 28 computes ACCESSIBLE NAMES non-conformantly: it drops the
      # separator space between a text node and an adjacent inline element, so
      # `All<span class="sr-only"> statuses</span>` is named "Allstatuses" and
      # the filters trigger is named "Filters4 active". accname 1.2 step 2I
      # says to append with a space; Chrome, Firefox and Safari all do.
      #
      #   • ⚠ THE PRODUCT MARKUP IS CORRECT, AND CI PROVES IT. On the very
      #     commit where `4 - test:unit + coverage` and `6 - test:web` went red
      #     (5 tests: T-PHONE-005a/b, T-UX-145c, T-TOOLBAR-002b, T-AVREV-009a),
      #     `9 - test:a11y` PASSED - that suite is Playwright against real
      #     browsers. Read a split like that as "the test engine is wrong",
      #     not "the component is wrong", and do NOT reshape `FilterBar.tsx`
      #     to satisfy jsdom: it would make the real-browser name worse to
      #     make a non-conformant simulation agree.
      #
      #   • There is NO dependency that fixes this. The space logic lives in
      #     `dom-accessibility-api`, not jsdom; its latest release (0.7.1,
      #     2025-11-27) is a publishing change with no fix, and
      #     `@testing-library/dom` pins `^0.5.9` so 0.7.x is unreachable
      #     anyway. Bumping testing-library will NOT clear this.
      #
      #   • Upstream jsdom#4091 is closed `not_planned`, but on PROCESS
      #     grounds ("uses a third-party library... please open a new issue
      #     with a minimal reproduction case with no third-party libraries"),
      #     NOT on the merits. It is unadjudicated, not rejected.
      #
      # Capped by VERSION rather than update-type, like `@types/node` above:
      # 26 is known good (the upstream report reproduces clean on 26.1.0), so
      # refusing only >= 28 keeps the cap as small as the evidence supports.
      # UNBLOCKED BY: jsdom restoring accname 1.2 step 2I space separation, or
      # `dom-accessibility-api` stopping relying on the old `display` default
      # AND `@testing-library/dom` widening its pin to take that release.
      # Verify by rebasing the bump and watching those 5 tests specifically.
      - dependency-name: 'jsdom'
        versions: ['>=28']
      # msw 3 is UNINSTALLABLE here, and the error does not say so. Every job
      # on #424 died at `npm ci` with `EUSAGE ... Missing: msw@2.15.0 from
      # lock file` — which reads like a stale lockfile and is not one. The
      # lockfile on that branch is correct: it resolves `msw@3.0.2` and
      # nothing anywhere declares 2.15.0.
      #
      #   • THE CAUSE IS A PEER RANGE WE DO NOT OWN. `@vitest/mocker` (pulled
      #     by `vitest`, latest 5.0.3) declares an OPTIONAL peer
      #     `msw: '^2.4.9'`. msw 3 does not satisfy it, so npm must nest an
      #     `msw@2.15.0` beside the mocker — a tree Dependabot's lockfile does
      #     not contain, hence EUSAGE.
      #
      #   • ⚠ IT REPRODUCES ONLY ON CI'S npm. npm 11 (local) tolerates the
      #     unsatisfied optional peer and `npm ci --dry-run` SUCCEEDS on the
      #     exact merge commit CI rejects; npm 10.9.x, which is what Node
      #     22.23.3 bundles in `1 · lint` and every other job, does not. Do
      #     not conclude "works locally, so the PR is fine" — pin the npm
      #     version before believing a local install here.
      #
      #   • A second, independent blocker sits behind the first: msw 3 moved
      #     its entry points, so `import { http, HttpResponse, passthrough }
      #     from 'msw'` becomes `'msw/http'`, and `onUnhandledRequest` becomes
      #     `onUnhandledFrame`. That is a real migration across the four
      #     `tests/fixtures/msw/*` servers and the ~12 specs that start them —
      #     a version-only Dependabot bump can never be green, even after the
      #     peer range is fixed.
      #
      # UNBLOCKED BY: `@vitest/mocker` widening its `msw` peer range to accept
      # 3.x. Re-check with `npm view @vitest/mocker@latest peerDependencies`;
      # while it still prints `msw: '^2.4.9'`, this hold stands. Taking it
      # then is a migration task, not a queue drain.
      - dependency-name: 'msw'
        versions: ['>=3']
      # Prisma 7 is a migration, not a bump — and as of 2026-08-25 it is held
      # for a REASON THAT IS NOT ABOUT EFFORT. Measured on a full v7 branch
      # (`prisma`, `@prisma/client`, `@prisma/adapter-mssql` all at 7.9.1)
      # against a real `mcr.microsoft.com/mssql/server:2022-latest`:
      #
      #   • THE RUNTIME IS FINE. All 36 integration files / 550 tests pass on
      #     v7, including the batch-close/undo transactions, the filtered
      #     unique indexes, the CHECK constraints and the BIN2 collation. The
      #     load-bearing duplicate-refusal mapping still works: v7 surfaces the
      #     2627/2601 duplicate as Prisma `P2002` and `isUniqueViolation()`
      #     catches it. So "it does not work" is NOT the objection.
      #
      #   • ⚠ THE OBJECTION IS THE PRODUCTION DEPENDENCY TREE. On v7,
      #     `@prisma/client` pulls `prisma` into the PRODUCTION tree, which
      #     pulls `mysql2` and `pg` — a MySQL driver and a PostgreSQL driver
      #     shipped in a SQL-Server-only application (NFR-004). Worse, one of
      #     them, `seq-queue@0.0.5` (via `mysql2`), declares NO `license` field
      #     AT ALL — independently confirmed against the registry packument,
      #     not just taken from the gate's output. `T-LICENSE-001d` goes red,
      #     and correctly: an unlicensed package in the production tree of a
      #     public repository is a legal exposure, not a gate annoyance. It
      #     must not be silenced with a notices exception.
      #
      #   • The mechanical work is real but small and already scouted: v7
      #     rejects `url = env("DATABASE_URL")` in the schema (`P1012`) and
      #     wants a root `prisma.config.ts`; `prisma migrate diff
      #     --from-schema-datasource` became `--from-config-datasource` in
      #     `ci.yml`; and the CLI no longer auto-loads env vars, so the migrate
      #     steps need their environment supplied explicitly.
      #
      #   • ⚠ Also observed and worth knowing before anyone debugs it: on v7 a
      #     CHECK-constraint violation is MISLABELLED as "Foreign key
      #     constraint violated on the constraint: <ck_name>". Harmless to the
      #     tests (they assert rejection) and actively misleading in a log.
      #
      # There is no pressure to take it: v6 carries no advisory, and the audit
      # exception in `tools/check-audit.mjs` exists because npm's suggested
      # "fix" for GHSA-ggr8-5vv4-36mx is a prisma DOWNGRADE.
      # UNBLOCKED BY: `mysql2`/`pg` leaving the v7 production tree (or Prisma
      # making them optional), which is what makes the licence regression go
      # away. The schema/config migration is then a day's work, not a blocker.
      #
      # ~~Superseded (the effort estimate was right in spirit, wrong in
      # detail): "requires a DRIVER ADAPTER passed to the PrismaClient
      # constructor ... every PrismaClient construction site rewritten."~~ This
      # repo has used `@prisma/adapter-mssql` since ADR-0005 Rev 3, so the
      # adapter already exists and NO construction site needed rewriting on the
      # v7 branch; removing `url` alone let the schema validate and generate.
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # ⚠ The adapter was MISSING from this list, which is the whole reason a
      # v7 adapter PR could be raised at all while `prisma` and
      # `@prisma/client` were held. It is the same migration: the `prisma`
      # group makes them move together, and an ignore that covers two of three
      # group members holds nothing.
      - dependency-name: '@prisma/adapter-mssql'
        update-types: ['version-update:semver-major']
      # `@types/mssql` must track the `mssql` major actually installed, which
      # `@prisma/adapter-mssql` chooses for us (v6 → `mssql@11`, v7 →
      # `mssql@^12`). Floating the types to 12 against an `mssql@11` runtime
      # type-checks this code against an API it will not meet at run time — the
      # same failure shape as the `@types/node` entry above, and the same
      # reason it is not merely "out of date".
      # UNBLOCKED BY: the Prisma 7 migration above, which brings `mssql@12`.
      - dependency-name: '@types/mssql'
        update-types: ['version-update:semver-major']

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
