version: 2
updates:
  # npm — the monorepo root picks up all workspaces.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Packages that must move TOGETHER or CI cannot even install.
    #
    # Ungrouped, Dependabot raised `@typescript-eslint/eslint-plugin` 7 -> 8 on
    # its own and left `@typescript-eslint/parser` at 7. They are peers, so
    # `npm ci` died with ERESOLVE and all twelve jobs failed on a PR that could
    # never have passed in any order. The same trap applies to vite/plugin-react
    # and to the vitest packages, which share a version line.
    groups:
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
      testing-library:
        patterns:
          - '@testing-library/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # `prisma` (CLI) and `@prisma/client` are generated-code peers: the client
      # is emitted BY the CLI, so a version skew fails at `prisma generate`, not
      # at install. Ungrouped, Dependabot raised them as #27 and #30 — two PRs
      # that could not pass in any order or combination, 8 red jobs each.
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
    # Majors that CANNOT be taken yet. Each names the condition that unblocks
    # it, because an `ignore` with no exit criterion silently becomes permanent.
    ignore:
      # Node is pinned to 20 in .nvmrc, `engines`, and the digest-pinned
      # Dockerfile base image. These two require Node >= 22 (`jsdom` >= 22.22,
      # `jest-dom` >= 22), so they cannot install here at all.
      # UNBLOCKED BY: moving the runtime to Node 22 — which is a spec-touching
      # change (ADR + Dockerfile digest + .nvmrc + engines), not a dep bump.
      - dependency-name: 'jsdom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@testing-library/jest-dom'
        update-types: ['version-update:semver-major']
      # `@types/node` must track the Node major actually being run. Floating it
      # to 26 against a Node 20 runtime is worse than being out of date: code
      # would typecheck against APIs that do not exist at runtime, and the
      # failure appears in production rather than in CI.
      # UNBLOCKED BY: the same move to Node 22 — then pin to ^22.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint refuses to load against the TS 7.0 compiler API
      # ("typescript-eslint does not support TS 7.0"), so taking TS 7 would
      # disable linting across the repo rather than fail loudly. The project
      # sits on TS 6, which typescript-eslint v8 does support.
      # UNBLOCKED BY: typescript-eslint TS >= 7.1 support, tracked upstream at
      # typescript-eslint/typescript-eslint#10940.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0 <7.1.0']
      # Prisma 7 is a migration, not a bump — and as of 2026-08-25 it is held
      # for a REASON THAT IS NOT ABOUT EFFORT. Measured on a full v7 branch
      # (`prisma`, `@prisma/client`, `@prisma/adapter-mssql` all at 7.9.1)
      # against a real `mcr.microsoft.com/mssql/server:2022-latest`:
      #
      #   • THE RUNTIME IS FINE. All 36 integration files / 550 tests pass on
      #     v7, including the batch-close/undo transactions, the filtered
      #     unique indexes, the CHECK constraints and the BIN2 collation. The
      #     load-bearing duplicate-refusal mapping still works: v7 surfaces the
      #     2627/2601 duplicate as Prisma `P2002` and `isUniqueViolation()`
      #     catches it. So "it does not work" is NOT the objection.
      #
      #   • ⚠ THE OBJECTION IS THE PRODUCTION DEPENDENCY TREE. On v7,
      #     `@prisma/client` pulls `prisma` into the PRODUCTION tree, which
      #     pulls `mysql2` and `pg` — a MySQL driver and a PostgreSQL driver
      #     shipped in a SQL-Server-only application (NFR-004). Worse, one of
      #     them, `seq-queue@0.0.5` (via `mysql2`), declares NO `license` field
      #     AT ALL — independently confirmed against the registry packument,
      #     not just taken from the gate's output. `T-LICENSE-001d` goes red,
      #     and correctly: an unlicensed package in the production tree of a
      #     public repository is a legal exposure, not a gate annoyance. It
      #     must not be silenced with a notices exception.
      #
      #   • The mechanical work is real but small and already scouted: v7
      #     rejects `url = env("DATABASE_URL")` in the schema (`P1012`) and
      #     wants a root `prisma.config.ts`; `prisma migrate diff
      #     --from-schema-datasource` became `--from-config-datasource` in
      #     `ci.yml`; and the CLI no longer auto-loads env vars, so the migrate
      #     steps need their environment supplied explicitly.
      #
      #   • ⚠ Also observed and worth knowing before anyone debugs it: on v7 a
      #     CHECK-constraint violation is MISLABELLED as "Foreign key
      #     constraint violated on the constraint: <ck_name>". Harmless to the
      #     tests (they assert rejection) and actively misleading in a log.
      #
      # There is no pressure to take it: v6 carries no advisory, and the audit
      # exception in `tools/check-audit.mjs` exists because npm's suggested
      # "fix" for GHSA-ggr8-5vv4-36mx is a prisma DOWNGRADE.
      # UNBLOCKED BY: `mysql2`/`pg` leaving the v7 production tree (or Prisma
      # making them optional), which is what makes the licence regression go
      # away. The schema/config migration is then a day's work, not a blocker.
      #
      # ~~Superseded (the effort estimate was right in spirit, wrong in
      # detail): "requires a DRIVER ADAPTER passed to the PrismaClient
      # constructor ... every PrismaClient construction site rewritten."~~ This
      # repo has used `@prisma/adapter-mssql` since ADR-0005 Rev 3, so the
      # adapter already exists and NO construction site needed rewriting on the
      # v7 branch; removing `url` alone let the schema validate and generate.
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # ⚠ The adapter was MISSING from this list, which is the whole reason a
      # v7 adapter PR could be raised at all while `prisma` and
      # `@prisma/client` were held. It is the same migration: the `prisma`
      # group makes them move together, and an ignore that covers two of three
      # group members holds nothing.
      - dependency-name: '@prisma/adapter-mssql'
        update-types: ['version-update:semver-major']
      # `@types/mssql` must track the `mssql` major actually installed, which
      # `@prisma/adapter-mssql` chooses for us (v6 → `mssql@11`, v7 →
      # `mssql@^12`). Floating the types to 12 against an `mssql@11` runtime
      # type-checks this code against an API it will not meet at run time — the
      # same failure shape as the `@types/node` entry above, and the same
      # reason it is not merely "out of date".
      # UNBLOCKED BY: the Prisma 7 migration above, which brings `mssql@12`.
      - dependency-name: '@types/mssql'
        update-types: ['version-update:semver-major']

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
